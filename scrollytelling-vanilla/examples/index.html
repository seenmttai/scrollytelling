<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scrollytelling Vanilla Advanced Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }
        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .controls button {
            margin-right: 5px;
        }
        .scrolly-section {
            padding: 2rem;
            border-bottom: 2px solid #ccc;
        }
        #scrolly-container {
            height: 500vh;
            position: relative;
            background-color: white;
        }
        .sticky-content {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            overflow: hidden;
        }
        #simple-animation {
            font-size: 3rem;
            opacity: 0;
        }
        #complex-animation {
            position: absolute;
            bottom: 20px;
            width: 100px;
            height: 100px;
            background-color: rebeccapurple;
        }
        #parallax-element {
            position: absolute;
            top: 150vh;
            left: 10%;
            width: 150px;
            height: 150px;
            background-color: cornflowerblue;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stagger-section {
            position: absolute;
            top: 250vh;
            width: 100%;
            text-align: center;
        }
        .stagger-container {
            display: inline-flex;
            gap: 10px;
        }
        .stagger-item {
            width: 50px;
            height: 50px;
            background-color: teal;
            opacity: 0;
        }
        #waypoint-indicator {
            position: fixed;
            top: 50%;
            right: 20px;
            width: 20px;
            height: 20px;
            background-color: red;
            border-radius: 50%;
            transition: background-color 0.3s ease;
            z-index: 1000;
        }
        #waypoint-tween-element {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background-color: coral;
            border-radius: 50%;
            transform: scale(0);
        }
        #scrolly-container-2 {
            height: 200vh;
            position: relative;
            background-color: #e0f7fa;
        }
        #second-instance-animation {
            font-size: 2rem;
            color: #004d40;
            opacity: 0;
        }
        .final-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background-color: #1a1a1a;
            color: white;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="init-btn">Initialize</button>
        <button id="destroy-btn">Destroy</button>
        <button id="scroll-to-label-btn">Scroll to Waypoint</button>
    </div>

    <div id="waypoint-indicator" title="Waypoint Indicator"></div>
    <div id="waypoint-tween-element" title="Waypoint Tween Element"></div>

    <div class="scrolly-section" id="scrolly-container">
        <div class="sticky-content">
            <h1 id="simple-animation">.addAnimation()</h1>
            <div id="complex-animation"></div>
        </div>
        <div id="parallax-element">.addParallax()</div>
        <div class="stagger-section">
            <h2>.addStagger()</h2>
            <div class="stagger-container">
                <div class="stagger-item"></div>
                <div class="stagger-item"></div>
                <div class="stagger-item"></div>
                <div class="stagger-item"></div>
            </div>
        </div>
    </div>

    <div class="scrolly-section" id="scrolly-container-2">
         <div class="sticky-content">
            <h2 id="second-instance-animation">Second Instance</h2>
        </div>
    </div>

    <div class="final-section">
        <p>End of scroll area.</p>
    </div>

    <script type="module" src="./test.js"></script>

</body>
</html>
